<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#185FA5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<script src="config.js"></script>
<script src="https://cdn.maptiler.com/maptiler-sdk-js/v2.5.0/maptiler-sdk.umd.min.js"></script>
<link href="https://cdn.maptiler.com/maptiler-sdk-js/v2.5.0/maptiler-sdk.css" rel="stylesheet">
<title>WalkTracker</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#185FA5;--bg:#121212;--surface:#1E1E1E;--surface2:#2A2A2A;--text:#E0E0E0;--text2:#999;--radius:12px;--shadow:0 2px 8px rgba(0,0,0,.3)}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.4}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:0 auto;position:relative}

/* HEADER */
header{background:var(--surface);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #333;z-index:10;flex-shrink:0}
header h1{font-size:18px;font-weight:700;color:#fff;letter-spacing:-.3px}
#street-name{font-size:12px;color:var(--text2);flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* RECORD INDICATOR */
#record-indicator{display:flex;align-items:center;gap:6px;font-size:12px;color:#ff4444;font-weight:600}
#record-indicator.hidden{display:none}
.pulse-dot{width:10px;height:10px;border-radius:50%;background:#ff4444;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}

/* MAIN CONTENT */
main{flex:1;position:relative;overflow:hidden}
.tab{display:none;height:100%;flex-direction:column;position:absolute;inset:0}
.tab.active{display:flex}

/* MAPS */
.map-container{flex:1;min-height:0;width:100%}
.map-container.small{height:280px;flex:none;border-radius:var(--radius);overflow:hidden;margin:12px}
.maplibregl-ctrl-attrib{font-size:10px!important}

/* RECORD CONTROLS */
#record-controls{background:var(--surface);padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;border-top:1px solid #333;flex-shrink:0}
#record-btn{width:72px;height:72px;border-radius:50%;border:4px solid var(--primary);background:var(--primary);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .3s;position:relative}
#record-btn.recording{border-color:#ff4444;background:transparent;color:#ff4444}
#record-btn.recording::after{content:'';position:absolute;inset:14px;border-radius:4px;background:#ff4444}
#record-btn:active{transform:scale(.95)}
#locate-row{display:flex;align-items:center;gap:16px;width:100%;justify-content:center}
#locate-btn,#live-btn,#share-btn-live{padding:8px 14px;border-radius:20px;border:1px solid var(--primary);background:transparent;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
#locate-btn:active{background:var(--primary);color:#fff}
#live-btn.on,#share-btn-live.on{background:var(--primary);color:#fff}
#share-btn-live.on{border-color:#ff4444;background:#ff4444}
#live-stats{display:flex;gap:20px;width:100%;justify-content:center}
#live-stats span{font-size:13px;color:var(--text2);text-align:center}
#live-stats span strong{display:block;font-size:18px;color:var(--text);font-weight:700;margin-top:2px}
#dest-row{width:100%;position:relative}
#dest-input{width:100%;padding:10px 34px 10px 14px;border-radius:var(--radius);border:2px solid transparent;background:var(--surface2);color:var(--text);font-size:13px;outline:none}
#dest-input:focus{border-color:var(--primary)}
#dest-input::placeholder{color:#666}
#dest-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:var(--text2);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px}
#dest-clear.hidden{display:none}
#dest-results{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
#dest-results.hidden{display:none}
#dest-info{width:100%;text-align:center;font-size:12px;font-weight:600;color:var(--primary)}
#dest-info.hidden{display:none}
#dest-info.arrived{color:#4CAF50}

/* USER LOCATION MARKER */
.user-marker{width:16px;height:16px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 0 0 2px var(--primary)}
.user-marker.pulsing{animation:gps-pulse 1.5s ease-in-out infinite}
@keyframes gps-pulse{0%{box-shadow:0 0 0 2px var(--primary),0 0 0 0 rgba(24,95,165,.4)}50%{box-shadow:0 0 0 2px var(--primary),0 0 0 8px rgba(24,95,165,.1)}100%{box-shadow:0 0 0 2px var(--primary),0 0 0 0 rgba(24,95,165,.4)}}

/* START / END MARKERS */
.start-marker{width:14px;height:14px;border-radius:50%;background:#4CAF50;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.end-marker{width:14px;height:14px;border-radius:50%;background:transparent;border:3px solid #ff4444;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.dest-marker{font-size:26px;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer}

/* PIN MARKER */
.pin-marker{font-size:28px;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer}

/* HISTORY TAB */
#history-list{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
#history-list .empty-state{text-align:center;color:var(--text2);padding:40px 20px;font-size:15px}
.session-card{background:var(--surface2);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:background .2s}
.session-card:active{background:#333}
.session-name{font-size:15px;font-weight:600;color:#fff;margin-bottom:4px}
.session-meta{font-size:12px;color:var(--text2)}

/* SESSION DETAIL OVERLAY */
#session-detail{position:absolute;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;overflow-y:auto}
#session-detail.hidden{display:none}
#session-detail .btn{background:var(--primary);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;width:100%;margin-top:8px}
#session-detail .btn:active{opacity:.8}
#close-detail{background:transparent;color:var(--text2);border:none;padding:8px 16px;cursor:pointer;font-size:14px;align-self:flex-start;margin:8px}
#elevation-chart{width:100%;padding:0 12px 12px;overflow:hidden}
#elevation-chart svg{width:100%;height:auto;max-height:180px;display:block}
#session-info{padding:0 16px 16px}
#session-info h3{font-size:17px;margin-bottom:4px}
#session-info p{font-size:12px;color:var(--text2);margin-bottom:8px}
.session-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--text)}

/* EXPLORE TAB */
#explore-controls{position:absolute;top:12px;left:12px;right:12px;z-index:5;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#explore-controls > *{pointer-events:auto}
#search-input{width:100%;padding:12px 14px;border-radius:var(--radius);border:2px solid transparent;background:rgba(30,30,30,.95);color:var(--text);font-size:14px;outline:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#search-input:focus{border-color:var(--primary)}
#search-input::placeholder{color:#666}
#autocomplete-results{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
#autocomplete-results.hidden{display:none}
.autocomplete-item{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #333;transition:background .15s}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover,.autocomplete-item:active{background:var(--surface2)}
#layer-toggles{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:rgba(30,30,30,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 12px;border-radius:var(--radius)}
#layer-toggles label{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text);cursor:pointer}
#layer-toggles input[type="checkbox"]{accent-color:var(--primary)}
#style-selector{background:var(--surface2);color:var(--text);border:1px solid #444;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;margin-left:auto}
#hotspots-btn{background:var(--surface2);color:var(--text);border:1px solid #444;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
#hotspot-results{background:var(--surface);border-radius:var(--radius);overflow-y:auto;max-height:38vh;box-shadow:var(--shadow)}
#hotspot-results.hidden{display:none}
.hot-item{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hot-item:last-child{border-bottom:none}
.hot-item:hover,.hot-item:active{background:var(--surface2)}
.hot-item .hot-type{color:var(--text2);font-size:11px;white-space:nowrap}
.hot-marker{font-size:22px;line-height:1;text-shadow:0 1px 4px rgba(0,0,0,.5);cursor:pointer}

/* TAB BAR */
#tab-bar{display:flex;background:var(--surface);border-top:1px solid #333;flex-shrink:0;z-index:10}
#tab-bar button{flex:1;padding:10px;background:transparent;border:none;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;position:relative}
#tab-bar button.active{color:var(--primary)}
#tab-bar button.active::after{content:'';position:absolute;top:0;left:20%;right:20%;height:2px;background:var(--primary);border-radius:0 0 2px 2px}

/* PLACE DETAILS CARD */
#place-card{position:absolute;left:12px;right:12px;bottom:12px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;z-index:15}
#place-card h4{font-size:15px;color:#fff;margin-bottom:4px;padding-right:24px}
#place-card p{font-size:12px;color:var(--text2);margin-bottom:8px}
#place-card .pc-actions{display:flex;gap:8px}
#place-card .pc-actions button{flex:1;padding:9px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;background:var(--primary);color:#fff}
#pc-close{position:absolute;top:8px;right:10px;background:transparent;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:2px 6px}
#dest-info{cursor:pointer}

/* MISC */
.hidden{display:none!important}
.btn-primary{background:var(--primary);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600}
@media(min-width:481px){#app{border-left:1px solid #333;border-right:1px solid #333}}
</style>
</head>
<body>
<div id="app">

<header>
  <h1>WalkTracker</h1>
  <div id="record-indicator" class="hidden">
    <div class="pulse-dot"></div>
    <span>REC</span>
  </div>
  <div id="street-name"></div>
</header>

<main>
  <!-- TAB: RECORD -->
  <section id="tab-record" class="tab active">
    <div id="record-map" class="map-container"></div>
    <div id="record-controls">
      <div id="dest-row">
        <input id="dest-input" type="text" placeholder="🏁 Set destination (optional)…" autocomplete="off">
        <button id="dest-clear" class="hidden" aria-label="Clear destination">&times;</button>
        <div id="dest-results" class="hidden"></div>
      </div>
      <div id="dest-info" class="hidden"></div>
      <div id="live-stats">
        <span><strong id="stat-distance">0.00</strong>km</span>
        <span><strong id="stat-duration">00:00</strong>time</span>
        <span><strong id="stat-elevation">--</strong>elev</span>
      </div>
      <div id="locate-row">
        <button id="locate-btn" aria-label="Show my location">◎ Locate Me</button>
        <button id="record-btn" aria-label="Start/Stop Walk">Start</button>
        <button id="live-btn" aria-label="Toggle live navigation view">🧭 Live</button>
        <button id="share-btn-live" aria-label="Share my live location">📡 Share</button>
      </div>
    </div>
  </section>

  <!-- TAB: HISTORY -->
  <section id="tab-history" class="tab">
    <div id="history-list"></div>
    <div id="session-detail" class="hidden">
      <button id="close-detail">&larr; Back</button>
      <div id="replay-map" class="map-container small"></div>
      <div id="elevation-chart"></div>
      <div id="session-info"></div>
    </div>
  </section>

  <!-- TAB: EXPLORE -->
  <section id="tab-explore" class="tab">
    <div id="explore-map" class="map-container"></div>
    <div id="explore-controls">
      <input id="search-input" type="text" placeholder="Search destination..." autocomplete="off">
      <div id="autocomplete-results" class="hidden"></div>
      <div id="layer-toggles">
        <label><input type="checkbox" id="toggle-buildings" checked> Buildings</label>
        <label><input type="checkbox" id="toggle-weather"> Weather</label>
        <label><input type="checkbox" id="toggle-traffic"> Traffic</label>
        <label><input type="checkbox" id="toggle-3d"> 3D</label>
        <button id="hotspots-btn">🔥 Hot Spots</button>
        <select id="style-selector">
          <option value="outdoor-v2">Outdoor</option>
          <option value="streets-v2">Streets</option>
          <option value="satellite-v2">Satellite</option>
        </select>
      </div>
      <div id="hotspot-results" class="hidden"></div>
    </div>
  </section>
  <!-- PLACE DETAILS CARD (shown on map tap) -->
  <div id="place-card" class="hidden">
    <button id="pc-close" aria-label="Close">&times;</button>
    <h4 id="pc-title"></h4>
    <p id="pc-address"></p>
    <p id="pc-meta"></p>
    <div class="pc-actions">
      <button id="pc-setdest">🏁 Set as Destination</button>
    </div>
  </div>
</main>

<nav id="tab-bar">
  <button data-tab="record" class="active" aria-label="Record">Record</button>
  <button data-tab="history" aria-label="History">History</button>
  <button data-tab="explore" aria-label="Explore">Explore</button>
</nav>

</div>

<script type="module">
import { openDB } from 'https://cdn.jsdelivr.net/npm/idb@7.1.1/+esm';

const API_KEY = window.API_KEY;
const DB_NAME = 'walktracker';
const STORE_NAME = 'sessions';
const STEP_RATE = 1312;
const ARRIVAL_RADIUS_KM = 0.04; // ~40 m — counts as "arrived"
// Mode detection: 85th-percentile moving speed (km/h) → travel mode.
const MODE_INFO = {
  walk:    { icon: '🚶', label: 'Walk' },
  run:     { icon: '🏃', label: 'Run' },
  bike:    { icon: '🚴', label: 'Bike' },
  vehicle: { icon: '🚗', label: 'Vehicle' }
};

let db, recordMap, exploreMap, replayMap;
let watchId = null;
let recording = false;
let currentSession = null;
let routeCoords = [];
let routeTimes = []; // ms timestamp per recorded coord, for speed/mode detection
let currentPosition = null;
let startTime = null;
let timerInterval = null;
let userMarker = null;
let searchMarker = null;
let destination = null;
let destMarker = null;
let liveView = false;
let lastLiveCoord = null;
let hotspotMarkers = [];
let suggestedRoute = null;
let lastRouteFetch = { time: 0, origin: null };
let shareTopic = null;
let shareTimer = null;
let shareWatchId = null;

const $ = id => document.getElementById(id);
const streetName = $('street-name');
const recordBtn = $('record-btn');
const locateBtn = $('locate-btn');
const recordIndicator = $('record-indicator');
const statDist = $('stat-distance');
const statDur = $('stat-duration');
const statElev = $('stat-elevation');
const historyList = $('history-list');
const sessionDetail = $('session-detail');
const elevationChart = $('elevation-chart');
const sessionInfo = $('session-info');
const closeDetail = $('close-detail');
const searchInput = $('search-input');
const autoResults = $('autocomplete-results');
const destInput = $('dest-input');
const destClear = $('dest-clear');
const destResults = $('dest-results');
const destInfo = $('dest-info');
const chkBuildings = $('toggle-buildings');
const chkWeather = $('toggle-weather');
const chkTraffic = $('toggle-traffic');
const chk3d = $('toggle-3d');
const hotspotsBtn = $('hotspots-btn');
const hotspotResults = $('hotspot-results');
const liveBtn = $('live-btn');
const shareBtn = $('share-btn-live');
const styleSel = $('style-selector');
const placeCard = $('place-card');
const pcTitle = $('pc-title');
const pcAddress = $('pc-address');
const pcMeta = $('pc-meta');
const tabBtns = document.querySelectorAll('[data-tab]');

async function init() {
  maptilersdk.config.apiKey = API_KEY;
  db = await openDB(DB_NAME, 1, {
    upgrade(d) {
      if (!d.objectStoreNames.contains(STORE_NAME))
        d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
    }
  });
  initRecordMap();
  initExploreMap();
  loadHistory();
  setupTabs();
  registerSW();
  setupMapClicks();
  if (!initWatchMode()) {
    smartLocate();
    restoreDestination();
  }
}

/* ---- PLACE DETAILS ON MAP TAP ---- */

let placeCardCoords = null;
let placeCardName = '';

function setupMapClicks() {
  recordMap.on('click', e => showPlaceCard([e.lngLat.lng, e.lngLat.lat]));
  exploreMap.on('click', e => showPlaceCard([e.lngLat.lng, e.lngLat.lat]));
}

async function showPlaceCard(coords) {
  placeCardCoords = coords;
  placeCardName = 'Dropped pin';
  pcTitle.textContent = 'Looking up place…';
  pcAddress.textContent = '';
  const bits = [`${coords[1].toFixed(5)}, ${coords[0].toFixed(5)}`];
  if (currentPosition) {
    const km = haversine(currentPosition, coords);
    bits.push(km < 1 ? `${Math.round(km * 1000)} m away` : `${km.toFixed(2)} km away`);
  }
  pcMeta.textContent = bits.join(' · ');
  placeCard.classList.remove('hidden');
  fetchElevation(coords[1], coords[0]).then(e => {
    if (e != null) { bits.push(`⛰ ${e.toFixed(0)} m elevation`); pcMeta.textContent = bits.join(' · '); }
  });
  try {
    const r = await fetch(`https://api.maptiler.com/geocoding/${coords[0]},${coords[1]}.json?key=${API_KEY}&language=en&limit=3`);
    const d = await r.json();
    const f = d.features?.[0];
    if (f) {
      placeCardName = f.place_name.split(',')[0];
      pcTitle.textContent = '📍 ' + placeCardName;
      pcAddress.textContent = f.place_name;
    } else {
      pcTitle.textContent = '📍 Dropped pin';
      pcAddress.textContent = 'No address data for this spot';
    }
  } catch {
    pcTitle.textContent = '📍 Dropped pin';
  }
}

/* ---- LIVE LOCATION SHARING (positions stored in our own DB via /api/share) ---- */

function toggleShare() {
  shareTopic ? stopSharing() : startSharing();
}

async function startSharing() {
  if (!navigator.geolocation) { alert('Geolocation not available'); return; }
  const rand = crypto.getRandomValues(new Uint8Array(8));
  shareTopic = 'wt-' + Array.from(rand, b => b.toString(16).padStart(2, '0')).join('');
  const url = `${location.origin}${location.pathname}?watch=${shareTopic}`;
  shareBtn.textContent = '📡 Sharing';
  shareBtn.classList.add('on');
  // GPS updates also flow while not recording, so the watcher tracks you either way
  if (watchId === null && shareWatchId === null) {
    shareWatchId = navigator.geolocation.watchPosition(onPosition, onError, {
      enableHighAccuracy: true, timeout: 10000, maximumAge: 5000
    });
  }
  shareTimer = setInterval(publishPosition, 12000);
  publishPosition();
  let copied = false;
  try { await navigator.clipboard.writeText(url); copied = true; } catch {}
  if (navigator.share) {
    navigator.share({ title: 'Follow my walk live', url }).catch(() => {});
  } else {
    alert(`Live-location link${copied ? ' (copied to clipboard)' : ''} — send it to someone you trust:\n\n${url}\n\nThey'll see you move on the map. Tap 📡 again to stop sharing.`);
  }
}

function stopSharing() {
  clearInterval(shareTimer); shareTimer = null;
  if (shareWatchId !== null) { navigator.geolocation.clearWatch(shareWatchId); shareWatchId = null; }
  fetch(`/api/share?topic=${shareTopic}`, { method: 'DELETE' }).catch(() => {});
  shareTopic = null;
  shareBtn.textContent = '📡 Share';
  shareBtn.classList.remove('on');
}

async function publishPosition() {
  if (!shareTopic || !currentPosition) return;
  try {
    await fetch('/api/share', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: shareTopic, lng: currentPosition[0], lat: currentPosition[1] })
    });
  } catch {}
}

// Opened via a shared ?watch= link: follow the sharer instead of tracking ourselves.
function initWatchMode() {
  const topic = new URLSearchParams(location.search).get('watch');
  if (!topic || !/^wt-[0-9a-f]{16}$/.test(topic)) return false;
  streetName.textContent = '👀 Connecting to shared location…';
  let marker = null, lastT = 0;
  const trail = [];
  async function poll() {
    try {
      const r = await fetch(`/api/share?topic=${topic}`);
      const p = await r.json();
      if (!p || p.t === lastT) return;
      lastT = p.t;
      const coords = [p.lng, p.lat];
      trail.push(coords);
      if (!marker) {
        const el = document.createElement('div');
        el.className = 'user-marker pulsing';
        el.style.background = '#FF9800';
        marker = new maptilersdk.Marker({ element: el }).setLngLat(coords).addTo(recordMap);
      } else marker.setLngLat(coords);
      if (trail.length > 1) addRouteLine(recordMap, trail, '#FF9800');
      recordMap.easeTo({ center: coords, zoom: 16, duration: 800 });
      const age = Math.round((Date.now() - p.t) / 1000);
      streetName.textContent = `👀 Live · updated ${age < 5 ? 'just now' : age + 's ago'}`;
    } catch {
      streetName.textContent = '👀 Live · reconnecting…';
    }
  }
  poll();
  setInterval(poll, 8000);
  return true;
}

/* ---- SMART START LOCATION ---- */

// Open the map where the user actually is: jump instantly to the last known
// position (or IP-based city on first visit), then refine to device GPS.
async function smartLocate() {
  const saved = localStorage.getItem('wt-lastpos');
  if (saved) {
    try { jumpMaps(JSON.parse(saved), 14); } catch {}
  } else {
    try {
      const r = await fetch(`https://api.maptiler.com/geolocation/ip.json?key=${API_KEY}`);
      const d = await r.json();
      if (d.longitude != null) jumpMaps([d.longitude, d.latitude], 11);
    } catch {}
  }
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    const coords = [pos.coords.longitude, pos.coords.latitude];
    currentPosition = coords;
    rememberPosition(coords);
    jumpMaps(coords, 15);
    updateUserLocation(recordMap, coords);
    reverseGeocode(coords);
    updateDestination();
  }, () => {}, { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
}

function jumpMaps(center, zoom) {
  recordMap.jumpTo({ center, zoom });
  exploreMap.jumpTo({ center, zoom });
}

function rememberPosition(coords) {
  try { localStorage.setItem('wt-lastpos', JSON.stringify(coords)); } catch {}
}

/* ---- DESTINATION LOCK (persists across reloads) ---- */

function restoreDestination() {
  const saved = localStorage.getItem('wt-dest');
  if (!saved) return;
  try {
    const d = JSON.parse(saved);
    if (Array.isArray(d.coords)) setDestination(d.coords, d.name);
  } catch {}
}

function registerSW() {
  if ('serviceWorker' in navigator)
    navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* ---- MAP HELPERS ---- */

function addRouteLine(map, coords, color = '#185FA5', width = 4) {
  const id = 'route-line';
  if (map.getLayer(id)) map.removeLayer(id);
  if (map.getSource(id)) map.removeSource(id);
  if (!coords || coords.length < 2) return;
  map.addSource(id, {
    type: 'geojson',
    data: { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } }
  });
  map.addLayer({
    id, type: 'line', source: id,
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': color, 'line-width': width, 'line-opacity': 0.85 }
  });
}

function removeRouteLine(map) {
  const id = 'route-line';
  if (map.getLayer(id)) map.removeLayer(id);
  if (map.getSource(id)) map.removeSource(id);
}

function removeAllMarkers(containerEl) {
  if (!containerEl) return;
  containerEl.querySelectorAll('.maplibregl-marker').forEach(el => {
    if (el.parentNode) el.remove();
  });
}

function addMarker(map, coords, className) {
  const el = document.createElement('div');
  el.className = className;
  new maptilersdk.Marker({ element: el }).setLngLat(coords).addTo(map);
  return el;
}

function addBuildingsLayers(map) {
  if (map.getSource('buildings')) return;
  map.addSource('buildings', {
    type: 'vector',
    url: `https://api.maptiler.com/tiles/buildings/tiles.json?key=${API_KEY}`
  });
  const before = getLabelLayerId(map);
  const layers = [
    { id: 'buildings-fill', type: 'fill', paint: { 'fill-color': '#627591', 'fill-opacity': 0.3 } },
    { id: 'buildings-outline', type: 'line', paint: { 'line-color': '#627591', 'line-width': 0.5 } }
  ];
  layers.forEach(l => {
    map.addLayer({ ...l, source: 'buildings', 'source-layer': 'building' }, before);
  });
}

function getLabelLayerId(map) {
  const layers = map.getStyle().layers;
  for (let i = 0; i < layers.length; i++) {
    if (layers[i].type === 'symbol') return layers[i].id;
  }
  return undefined;
}

function removeBuildingsLayers(map) {
  ['buildings-fill','buildings-outline'].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
  if (map.getSource('buildings')) map.removeSource('buildings');
}

function addWeatherLayers(map) {

  });
  map.addLayer({
    id: 'weather-precip-layer', type: 'raster', source: 'weather-precip',

  });
  map.addSource('weather-clouds', {
    type: 'raster',
    tiles: [`https://api.maptiler.com/weather/clouds/{z}/{x}/{y}.png?key=${API_KEY}`],
    tileSize: 256
  });
  map.addLayer({
    id: 'weather-clouds-layer', type: 'raster', source: 'weather-clouds',
    paint: { 'raster-opacity': 0.25 }
  });

function removeWeatherLayers(map) {
  ['weather-precip-layer','weather-clouds-layer'].forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
  ['weather-precip','weather-clouds'].forEach(id => { if (map.getSource(id)) map.removeSource(id); });

/* ---- HOT SPOTS (nearby POIs via OpenStreetMap Overpass) ---- */

const HOT_ICONS = { attraction: '⭐', museum: '🏛', viewpoint: '🌄', gallery: '🖼', zoo: '🦁',
  cafe: '☕', restaurant: '🍽', bar: '🍻', pub: '🍻', fast_food: '🍔', park: '🌳' };

async function findHotspots() {
  const c = exploreMap.getCenter();
  hotspotsBtn.textContent = '🔥 Searching…';
  const q = `[out:json][timeout:12];(
    node(around:1500,${c.lat},${c.lng})[tourism~"attraction|museum|viewpoint|gallery|zoo"][name];
    node(around:1500,${c.lat},${c.lng})[amenity~"cafe|restaurant|bar|pub|fast_food"][name];
    node(around:1500,${c.lat},${c.lng})[leisure=park][name];
  );out body 60;`;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) });
    const d = await r.json();
    const spots = (d.elements || [])
      .map(e => ({
        name: e.tags.name,
        type: e.tags.tourism || e.tags.amenity || e.tags.leisure,
        coords: [e.lon, e.lat],
        // places notable enough for a Wikipedia entry rank first
        score: (e.tags.wikipedia || e.tags.wikidata ? 2 : 0) + (e.tags.tourism ? 1 : 0)
      }))
      .sort((a, b) => b.score - a.score)
      .slice(0, 12);
    renderHotspots(spots);
  } catch (e) {
    console.warn('Overpass:', e);
    hotspotResults.innerHTML = '<div class="hot-item">Could not load nearby places — try again shortly.</div>';
    hotspotResults.classList.remove('hidden');
  }
  hotspotsBtn.textContent = '🔥 Hot Spots';
}

function renderHotspots(spots) {
  clearHotspots();
  if (!spots.length) {
    hotspotResults.innerHTML = '<div class="hot-item">No notable places found nearby. Pan the map and try again.</div>';
    hotspotResults.classList.remove('hidden');
    return;
  }
  hotspotResults.innerHTML = spots.map((s, i) => `
    <div class="hot-item" data-i="${i}">
      <span>${HOT_ICONS[s.type] || '📍'} ${escHtml(s.name)}</span>
      <span class="hot-type">${escHtml(s.type.replace('_', ' '))}</span>
    </div>`).join('');
  hotspotResults.classList.remove('hidden');
  spots.forEach(s => {
    const el = document.createElement('div');
    el.className = 'hot-marker';
    el.textContent = HOT_ICONS[s.type] || '📍';
    hotspotMarkers.push(new maptilersdk.Marker({ element: el })
      .setLngLat(s.coords)
      .setPopup(new maptilersdk.Popup().setText(s.name))
      .addTo(exploreMap));
  });
  hotspotResults.querySelectorAll('.hot-item').forEach(el => {
    el.addEventListener('click', () => {
      const s = spots[+el.dataset.i];
      exploreMap.flyTo({ center: s.coords, zoom: 17 });
      hotspotResults.classList.add('hidden');
    });
  });
}

function clearHotspots() {
  hotspotMarkers.forEach(m => m.remove());
  hotspotMarkers = [];
}

/* ---- GPS TRACKING ---- */

function startRecording() {
  if (!navigator.geolocation) { alert('Geolocation not available'); return; }
  recording = true;
  routeCoords = [];
  routeTimes = [];
  startTime = Date.now();
  currentSession = {
    name: getSessionName(),
    coordinates: [],
    distance: 0, duration: 0, steps: 0,
    startTime: startTime,
    date: new Date().toISOString()
  };
  recordBtn.textContent = 'Stop';
  recordBtn.classList.add('recording');
  recordIndicator.classList.remove('hidden');
  timerInterval = setInterval(updateTimer, 1000);
  statDist.textContent = '0.00';
  statDur.textContent = '00:00';
  statElev.textContent = '--';
  // start a fresh trip toward the destination (clear any prior "arrived" state)
  destInfo.classList.remove('arrived');
  updateDestination();
  watchId = navigator.geolocation.watchPosition(onPosition, onError, {
    enableHighAccuracy: true, timeout: 10000, maximumAge: 5000
  });
}

function stopRecording() {
  recording = false;
  recordBtn.textContent = 'Start';
  recordBtn.classList.remove('recording');
  recordIndicator.classList.add('hidden');
  if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
  clearInterval(timerInterval);
  if (routeCoords.length > 1) finalizeSession();
  else routeCoords = [];
}

function onPosition(pos) {
  const { latitude: lat, longitude: lng } = pos.coords;
  const coords = [lng, lat];
  currentPosition = coords;
  rememberPosition(coords);
  updateUserLocation(recordMap, coords);
  updateDestination();
  if (recording) {
    routeCoords.push(coords);
    routeTimes.push(Date.now());
    addRouteLine(recordMap, routeCoords);
    moveCamera(coords);
    const dist = calcDistance(routeCoords);
    const dur = (Date.now() - startTime) / 1000;
    currentSession.distance = dist;
    currentSession.duration = dur;
    currentSession.steps = Math.round(dist * STEP_RATE);
    statDist.textContent = dist.toFixed(2);
    fetchElevation(lat, lng).then(e => { if (e !== null) statElev.textContent = e.toFixed(0); });
    reverseGeocode(coords);
    if (destination && haversine(coords, destination) <= ARRIVAL_RADIUS_KM) arriveAtDestination();
  } else {
    reverseGeocode(coords);
  }
}

/* ---- DESTINATION ---- */

function setDestination(coords, name) {
  destination = coords;
  suggestedRoute = null;
  lastRouteFetch = { time: 0, origin: null };
  try { localStorage.setItem('wt-dest', JSON.stringify({ coords, name })); } catch {}
  if (destMarker) destMarker.remove();
  const el = document.createElement('div');
  el.className = 'dest-marker';
  el.textContent = '🏁'; // 🏁 checkered flag
  destMarker = new maptilersdk.Marker({ element: el })
    .setLngLat(coords)
    .setPopup(new maptilersdk.Popup().setText(name || 'Destination'))
    .addTo(recordMap);
  destClear.classList.remove('hidden');
  destInput.value = name || '';
  fitToDestination();
  updateDestination();
}

function clearDestination() {
  destination = null;
  suggestedRoute = null;
  localStorage.removeItem('wt-dest');
  if (destMarker) { destMarker.remove(); destMarker = null; }
  removeGuideLine();
  removeSuggestedRoute();
  destClear.classList.add('hidden');
  destInput.value = '';
  destInfo.classList.add('hidden');
  destInfo.classList.remove('arrived');
}

function fitToDestination() {
  if (!destination) return;
  if (currentPosition) {
    try {
      const b = new maptilersdk.LngLatBounds(currentPosition, currentPosition).extend(destination);
      recordMap.fitBounds(b, { padding: 80, maxZoom: 16, duration: 800 });
    } catch { recordMap.flyTo({ center: destination, zoom: 14 }); }
  } else {
    recordMap.flyTo({ center: destination, zoom: 14, duration: 800 });
  }
}

// Update the guide toward the destination: a TomTom shortest walking route
// when available, otherwise the straight dashed line. Re-routes at most
// every 45 s and only after moving ~50 m, to stay inside the free quota.
function updateDestination() {
  if (!destination || !currentPosition) return;
  if (destInfo.classList.contains('arrived')) return;
  if (window.TOMTOM_KEY) {
    const now = Date.now();
    const moved = !lastRouteFetch.origin || haversine(lastRouteFetch.origin, currentPosition) > 0.05;
    const due = suggestedRoute
      ? (now - lastRouteFetch.time > 45000 && moved)
      : now - lastRouteFetch.time > 15000 || lastRouteFetch.time === 0;
    if (due) suggestRoute();
  }
  const km = haversine(currentPosition, destination);
  const left = km < 1 ? `${Math.round(km * 1000)} m` : `${km.toFixed(2)} km`;
  destInfo.textContent = suggestedRoute
    ? `🏁 ${left} left · route ${fmtRouteDist(suggestedRoute.meters)} · ~${Math.max(1, Math.round(suggestedRoute.seconds / 60))} min walk`
    : `🏁 ${left} to destination`;
  destInfo.classList.remove('hidden');
  if (!suggestedRoute) drawGuideLine(currentPosition, destination);
}

function fmtRouteDist(meters) {
  return meters < 1000 ? `${Math.round(meters)} m` : `${(meters / 1000).toFixed(2)} km`;
}

async function suggestRoute() {
  lastRouteFetch = { time: Date.now(), origin: currentPosition };
  const route = await fetchRoute(currentPosition, destination);
  if (!route || !destination) return;
  suggestedRoute = route;
  removeGuideLine();
  drawSuggestedRoute(route.coords);
  updateDestination();
}

async function fetchRoute(from, to) {
  if (!window.TOMTOM_KEY || !from || !to) return null;
  try {
    const r = await fetch(`https://api.tomtom.com/routing/1/calculateRoute/${from[1]},${from[0]}:${to[1]},${to[0]}/json?key=${window.TOMTOM_KEY}&travelMode=pedestrian&routeType=shortest`);
    if (!r.ok) return null;
    const route = (await r.json()).routes?.[0];
    if (!route) return null;
    return {
      coords: route.legs.flatMap(l => l.points.map(p => [p.longitude, p.latitude])),
      meters: route.summary.lengthInMeters,
      seconds: route.summary.travelTimeInSeconds
    };
  } catch { return null; }
}

function drawSuggestedRoute(coords) {
  const id = 'suggested-route';
  const data = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: coords } };
  if (!recordMap || !recordMap.isStyleLoaded()) return;
  if (recordMap.getSource(id)) { recordMap.getSource(id).setData(data); return; }
  recordMap.addSource(id, { type: 'geojson', data });
  recordMap.addLayer({
    id, type: 'line', source: id,
    layout: { 'line-join': 'round', 'line-cap': 'round' },
    paint: { 'line-color': '#4CAF50', 'line-width': 4, 'line-opacity': 0.75 }
  });
}

function removeSuggestedRoute() {
  if (!recordMap) return;
  const id = 'suggested-route';
  if (recordMap.getLayer(id)) recordMap.removeLayer(id);
  if (recordMap.getSource(id)) recordMap.removeSource(id);
}

function arriveAtDestination() {
  removeGuideLine();
  removeSuggestedRoute();
  destInfo.textContent = '🎉 You’ve arrived at your destination!';
  destInfo.classList.remove('hidden');
  destInfo.classList.add('arrived');
  if (recording) stopRecording(); // auto-stop & save the walk
}

function drawGuideLine(from, to) {
  const id = 'guide-line';
  const data = { type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [from, to] } };
  if (!recordMap || !recordMap.isStyleLoaded()) return;
  if (recordMap.getSource(id)) { recordMap.getSource(id).setData(data); return; }
  recordMap.addSource(id, { type: 'geojson', data });
  recordMap.addLayer({
    id, type: 'line', source: id,
    layout: { 'line-cap': 'round' },
    paint: { 'line-color': '#888', 'line-width': 2, 'line-dasharray': [2, 2], 'line-opacity': 0.7 }
  });
}

function removeGuideLine() {
  if (!recordMap) return;
  const id = 'guide-line';
  if (recordMap.getLayer(id)) recordMap.removeLayer(id);
  if (recordMap.getSource(id)) recordMap.removeSource(id);
}

function onError(err) { console.warn('GPS:', err.message); }

/* ---- LIVE NAVIGATION VIEW ---- */

// Camera while recording: live view follows you tilted like a navigator;
// with a destination set it frames both you and the flag so the path
// ahead stays visible; otherwise it just follows you.
function moveCamera(coords) {
  if (liveView) {
    const bearing = lastLiveCoord && haversine(lastLiveCoord, coords) > 0.003
      ? calcBearing(lastLiveCoord, coords)
      : recordMap.getBearing();
    recordMap.easeTo({ center: coords, zoom: 17, pitch: 60, bearing, duration: 900 });
  } else if (destination && !destInfo.classList.contains('arrived')) {
    try {
      const b = new maptilersdk.LngLatBounds(coords, coords).extend(destination);
      recordMap.fitBounds(b, { padding: 70, maxZoom: 16, duration: 800 });
    } catch { recordMap.flyTo({ center: coords, zoom: 16, duration: 800 }); }
  } else {
    recordMap.flyTo({ center: coords, zoom: 16, duration: 800 });
  }
  lastLiveCoord = coords;
}

function toggleLiveView() {
  liveView = !liveView;
  liveBtn.classList.toggle('on', liveView);
  if (liveView) {
    add3dBuildings(recordMap);
    const target = currentPosition || recordMap.getCenter();
    recordMap.easeTo({ center: target, zoom: 17, pitch: 60, duration: 900 });
  } else {
    remove3dBuildings(recordMap);
    recordMap.easeTo({ pitch: 0, bearing: 0, duration: 700 });
  }
}

function calcBearing(a, b) {
  const [l1, p1] = a.map(c => c * Math.PI / 180);
  const [l2, p2] = b.map(c => c * Math.PI / 180);
  const y = Math.sin(l2 - l1) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(l2 - l1);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}

function locateUser() {
  if (!navigator.geolocation) { alert('Geolocation not available'); return; }
  locateBtn.textContent = '◎ Locating…';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude: lat, longitude: lng } = pos.coords;
      const coords = [lng, lat];
      currentPosition = coords;
      rememberPosition(coords);
      updateUserLocation(recordMap, coords);
      recordMap.flyTo({ center: coords, zoom: 16, duration: 1000 });
      reverseGeocode(coords);
      updateDestination();
      locateBtn.textContent = '◎ Locate Me';
    },
    (err) => {
      console.warn('Locate error:', err.message);
      locateBtn.textContent = '◎ Locate Me';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function updateUserLocation(map, coords) {
  if (userMarker) userMarker.remove();
  const el = document.createElement('div');
  el.className = 'user-marker' + (recording ? ' pulsing' : '');
  userMarker = new maptilersdk.Marker({ element: el }).setLngLat(coords).addTo(map);
}

function updateTimer() {
  if (!startTime) return;
  const dur = (Date.now() - startTime) / 1000;
  statDur.textContent = fmtDuration(dur);
}

/* ---- SESSION MANAGEMENT ---- */

async function finalizeSession() {
  const s = currentSession;
  currentSession = null;
  s.coordinates = routeCoords.slice();
  s.distance = calcDistance(routeCoords);
  s.duration = (Date.now() - startTime) / 1000;
  s.steps = Math.round(s.distance * STEP_RATE);
  s.mode = detectMode(routeCoords, routeTimes, s.duration);
  // Snap road-based trips to the road network to clean up GPS jitter.
  // Walks/runs keep raw GPS — paths and parks aren't in the road network.
  if (s.mode === 'bike' || s.mode === 'vehicle') {
    const snapped = await snapToRoads(s.coordinates);
    if (snapped) { s.coordinates = snapped; s.snapped = true; }
  }
  saveSession(s);
}

async function snapToRoads(coords) {
  if (!window.TOMTOM_KEY || !coords || coords.length < 2) return null;
  const pts = sampleCoords(coords, 100); // API limit: 100 points
  try {
    const r = await fetch(`https://api.tomtom.com/snapToRoads/1/snap?points=${pts.map(c => `${c[0]},${c[1]}`).join(';')}&key=${window.TOMTOM_KEY}`);
    if (!r.ok) return null;
    const d = await r.json();
    const out = [];
    for (const seg of d.route || []) {
      for (const c of seg.geometry?.coordinates || []) {
        const last = out[out.length - 1];
        if (!last || last[0] !== c[0] || last[1] !== c[1]) out.push(c);
      }
    }
    return out.length >= 2 ? out : null;
  } catch { return null; }
}

// Guess travel mode from the 85th-percentile moving speed (ignores stops/jitter).
// Heuristic only — overlapping speed bands mean it can be wrong.
function detectMode(coords, times, durationSec) {
  const kmh = estimateSpeedKmh(coords, times, durationSec);
  if (kmh == null || !isFinite(kmh)) return 'walk';
  if (kmh < 7) return 'walk';
  if (kmh < 13) return 'run';
  if (kmh < 28) return 'bike';
  return 'vehicle';
}

function estimateSpeedKmh(coords, times, durationSec) {
  if (!coords || coords.length < 2) return null;
  const speeds = [];
  if (times && times.length === coords.length) {
    for (let i = 1; i < coords.length; i++) {
      const dtH = (times[i] - times[i - 1]) / 3.6e6; // ms → hours
      if (dtH <= 0) continue;
      const v = haversine(coords[i - 1], coords[i]) / dtH;
      if (v > 1 && v < 250) speeds.push(v); // moving + sane only
    }
  }
  if (speeds.length) {
    speeds.sort((a, b) => a - b);
    return speeds[Math.min(speeds.length - 1, Math.floor(speeds.length * 0.85))];
  }
  // fallback: overall average speed
  if (durationSec > 0) return calcDistance(coords) / (durationSec / 3600);
  return null;
}

async function saveSession(s) {
  await db.add(STORE_NAME, s);
  loadHistory();
}

async function loadHistory() {
  const sessions = await db.getAll(STORE_NAME);
  sessions.reverse();
  if (!sessions.length) {
    historyList.innerHTML = '<div class="empty-state">No walks yet. Hit Record and start moving!</div>';
    return;
  }
  historyList.innerHTML = sessions.map(s => {
    const mode = MODE_INFO[s.mode];
    return `
    <div class="session-card" data-id="${s.id}">
      <div class="session-name">${mode ? mode.icon + ' ' : ''}${escHtml(s.name)}</div>
      <div class="session-meta">${new Date(s.date).toLocaleDateString()} · ${s.distance.toFixed(2)} km · ${fmtDuration(s.duration)}</div>
    </div>`;
  }).join('');
  historyList.querySelectorAll('.session-card').forEach(c => {
    c.addEventListener('click', () => showSession(+c.dataset.id));
  });
}

async function showSession(id) {
  const s = await db.get(STORE_NAME, id);
  if (!s) return;
  sessionDetail.classList.remove('hidden');
  const center = s.coordinates?.[0] || [-73.985, 40.748];
  initReplayMap(center);
  setTimeout(() => {
    drawReplayRoute(s);
    showElevation(s);
    sessionInfo.innerHTML = `
      <h3>${escHtml(s.name)}</h3>
      <p>${new Date(s.date).toLocaleString()}</p>
      <div class="session-stats">
        <span>📏 ${s.distance.toFixed(2)} km</span>
        <span>⏱ ${fmtDuration(s.duration)}</span>
        <span>👣 ${s.steps.toLocaleString()} steps</span>
        ${MODE_INFO[s.mode] ? `<span>${MODE_INFO[s.mode].icon} ${MODE_INFO[s.mode].label}</span>` : ''}
        ${s.snapped ? '<span>🛣 road-snapped</span>' : ''}
      </div>
      <button class="btn" id="share-btn">Share as Image</button>
    `;
    $('share-btn')?.addEventListener('click', () => shareSession(s));
  }, 400);
}

function drawReplayRoute(s) {
  removeRouteLine(replayMap);
  removeAllMarkers(document.getElementById('replay-map'));
  const coords = s.coordinates;
  if (!coords || coords.length < 2) return;
  addRouteLine(replayMap, coords);
  addMarker(replayMap, coords[0], 'start-marker');
  addMarker(replayMap, coords[coords.length - 1], 'end-marker');
  try {
    const bounds = coords.reduce((b, c) => b.extend(c), new maptilersdk.LngLatBounds(coords[0], coords[0]));
    replayMap.fitBounds(bounds, { padding: 60, maxZoom: 16 });
  } catch {}
}

async function showElevation(s) {
  elevationChart.innerHTML = '<p style="padding:12px;color:#666;font-size:13px">Loading elevation...</p>';
  const sampled = sampleCoords(s.coordinates, 80);
  try {
    const resp = await fetch(`https://api.maptiler.com/elevation/lines?key=${API_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ linestring: { type: 'LineString', coordinates: sampled } })
    });
    if (!resp.ok) throw new Error();
    const data = await resp.json();
    const elevs = data.elevations || (Array.isArray(data) ? data.map(d => d.elevation) : []);
    if (elevs.length < 2) throw new Error();
    renderChart(elevs, s.distance);
  } catch {
    const elevs = [];
    for (const [lng, lat] of sampled) {
      try {
        const r = await fetch(`https://api.maptiler.com/elevation/point?lat=${lat}&lng=${lng}&key=${API_KEY}`);
        const d = await r.json();
        elevs.push(d.elevation != null ? d.elevation : 0);
      } catch { elevs.push(0); }
    }
    if (elevs.length >= 2) renderChart(elevs, s.distance);
    else elevationChart.innerHTML = '<p style="padding:12px;color:#666;font-size:13px">Elevation data unavailable</p>';
  }
}

function renderChart(elevs, distKm) {
  const w = 600, h = 200, p = { top: 20, right: 16, bottom: 28, left: 44 };
  const cw = w - p.left - p.right, ch = h - p.top - p.bottom;
  const mn = Math.min(...elevs), mx = Math.max(...elevs), rng = mx - mn || 1;
  const pts = elevs.map((e, i) => {
    const x = p.left + (i / (elevs.length - 1)) * cw;
    const y = p.top + ch - ((e - mn) / rng) * ch;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const base = `${p.left},${p.top + ch} ${pts} ${p.left + cw},${p.top + ch}`;
  elevationChart.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
      <defs>
        <linearGradient id="eg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#185FA5" stop-opacity=".35"/>
          <stop offset="100%" stop-color="#185FA5" stop-opacity=".05"/>
        </linearGradient>
      </defs>
      <polygon points="${base}" fill="url(#eg)"/>
      <polyline points="${pts}" fill="none" stroke="#185FA5" stroke-width="2" stroke-linejoin="round"/>
      <text x="${p.left}" y="${p.top - 6}" fill="#888" font-size="10">${mx.toFixed(0)}m</text>
      <text x="${p.left}" y="${p.top + ch + 16}" fill="#888" font-size="10">0</text>
      <text x="${p.left + cw}" y="${p.top + ch + 16}" fill="#888" font-size="10" text-anchor="end">${distKm.toFixed(1)}km</text>
      <text x="${p.left - 4}" y="${p.top + ch + 4}" fill="#888" font-size="10" text-anchor="end">${mn.toFixed(0)}m</text>
    </svg>`;
}

function shareSession(s) {
  if (!s.coordinates?.length) return;
  const simple = simplifyCoords(s.coordinates, 30);
  const path = simple.map(c => `${c[0]},${c[1]}`).join('|');
  const encPath = path.replace(/\|/g, '%7C');
  const url = `https://api.maptiler.com/maps/outdoor-v2/static/auto/color:0x185FA5,weight:3|${encPath}/800x600.png?key=${API_KEY}`;
  const a = document.createElement('a');
  a.href = url;
  a.download = `walk-${s.name.replace(/\s+/g,'-')}.png`;
  a.target = '_blank';
  a.click();
}

/* ---- GEOCODING ---- */

async function reverseGeocode(coords) {
  try {
    const r = await fetch(`https://api.maptiler.com/geocoding/${coords[0]},${coords[1]}.json?key=${API_KEY}&language=en&limit=1`);
    const d = await r.json();
    if (d.features?.length) {
      const parts = d.features[0].place_name.split(',');
      streetName.textContent = parts.slice(0, 2).join(',').trim();
    }
  } catch {}
}

async function forwardGeocode(q) {
  if (!q || q.length < 2) return [];
  try {
    const r = await fetch(`https://api.maptiler.com/geocoding/${encodeURIComponent(q)}.json?key=${API_KEY}&language=en&limit=5`);
    const d = await r.json();
    return d.features || [];
  } catch { return []; }
}

let geoTimeout = null;
searchInput.addEventListener('input', () => {
  clearTimeout(geoTimeout);
  const q = searchInput.value.trim();
  if (q.length < 2) { autoResults.classList.add('hidden'); return; }
  geoTimeout = setTimeout(async () => {
    const results = await forwardGeocode(q);
    if (!results.length) { autoResults.classList.add('hidden'); return; }
    autoResults.innerHTML = results.map(r => `
      <div class="autocomplete-item" data-lng="${r.center[0]}" data-lat="${r.center[1]}" data-name="${escHtml(r.place_name)}">
        ${escHtml(r.place_name)}
      </div>
    `).join('');
    autoResults.classList.remove('hidden');
    autoResults.querySelectorAll('.autocomplete-item').forEach(el => {
      el.addEventListener('click', () => {
        const lng = +el.dataset.lng, lat = +el.dataset.lat;
        searchInput.value = el.dataset.name;
        autoResults.classList.add('hidden');
        placePin([lng, lat], el.dataset.name);
      });
    });
  }, 250);
});
document.addEventListener('click', e => {
  if (!e.target.closest('#explore-controls')) {
    autoResults.classList.add('hidden');
    hotspotResults.classList.add('hidden');
  }
  if (!e.target.closest('#dest-row')) destResults.classList.add('hidden');
});

/* ---- DESTINATION SEARCH (Record tab) ---- */

let destTimeout = null;
destInput.addEventListener('input', () => {
  clearTimeout(destTimeout);
  const q = destInput.value.trim();
  if (q.length < 2) { destResults.classList.add('hidden'); return; }
  destTimeout = setTimeout(async () => {
    const results = await forwardGeocode(q);
    if (!results.length) { destResults.classList.add('hidden'); return; }
    destResults.innerHTML = results.map(r => `
      <div class="autocomplete-item" data-lng="${r.center[0]}" data-lat="${r.center[1]}" data-name="${escHtml(r.place_name)}">
        ${escHtml(r.place_name)}
      </div>
    `).join('');
    destResults.classList.remove('hidden');
    destResults.querySelectorAll('.autocomplete-item').forEach(el => {
      el.addEventListener('click', () => {
        const lng = +el.dataset.lng, lat = +el.dataset.lat;
        destResults.classList.add('hidden');
        setDestination([lng, lat], el.dataset.name);
      });
    });
  }, 250);
});
destClear.addEventListener('click', clearDestination);

function placePin(coords, name) {
  if (searchMarker) searchMarker.remove();
  const el = document.createElement('div');
  el.className = 'pin-marker';
  el.textContent = '\uD83D\uDCCD';
  searchMarker = new maptilersdk.Marker({ element: el })
    .setLngLat(coords)
    .setPopup(new maptilersdk.Popup().setText(name))
    .addTo(exploreMap);
  exploreMap.flyTo({ center: coords, zoom: 15 });
}

/* ---- BUILDINGS / WEATHER / STYLE TOGGLES ---- */

chkBuildings.addEventListener('change', () => {
  chkBuildings.checked ? addBuildingsLayers(exploreMap) : removeBuildingsLayers(exploreMap);
});

chkWeather.addEventListener('change', () => {
  chkWeather.checked ? addWeatherLayers(exploreMap) : removeWeatherLayers(exploreMap);
});

chkTraffic.addEventListener('change', () => {
  chkTraffic.checked ? addTrafficLayers(exploreMap) : removeTrafficLayers(exploreMap);
});

chk3d.addEventListener('change', () => {
  chk3d.checked ? enable3d(exploreMap) : disable3d(exploreMap);
});

hotspotsBtn.addEventListener('click', findHotspots);

styleSel.addEventListener('change', () => {
  const m = { 'outdoor-v2': maptilersdk.MapStyle.OUTDOOR, 'streets-v2': maptilersdk.MapStyle.STREETS, 'satellite-v2': maptilersdk.MapStyle.SATELLITE };
  exploreMap.setStyle(m[styleSel.value] || styleSel.value);
  exploreMap.once('style.load', () => {
    if (chkBuildings.checked) addBuildingsLayers(exploreMap);
    if (chkWeather.checked) addWeatherLayers(exploreMap);
    if (chkTraffic.checked) addTrafficLayers(exploreMap);
    if (chk3d.checked) enable3d(exploreMap);
  });
});

function setupTabs() {
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
  closeDetail.addEventListener('click', () => {
    sessionDetail.classList.add('hidden');
    if (replayMap) { replayMap.remove(); replayMap = null; }
  });
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tabBtns.forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${tab}`).classList.add('active');
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  setTimeout(() => {
    if (tab === 'record' && recordMap) recordMap.resize();
    if (tab === 'explore' && exploreMap) exploreMap.resize();
  }, 300);
}

recordBtn.addEventListener('click', () => {
  recording ? stopRecording() : startRecording();
});

locateBtn.addEventListener('click', locateUser);
liveBtn.addEventListener('click', toggleLiveView);
shareBtn.addEventListener('click', toggleShare);
$('pc-close').addEventListener('click', () => placeCard.classList.add('hidden'));
$('pc-setdest').addEventListener('click', () => {
  if (!placeCardCoords) return;
  setDestination(placeCardCoords, placeCardName);
  destInput.value = placeCardName;
  placeCard.classList.add('hidden');
  switchTab('record');
});

destInfo.addEventListener('click', () => { if (destination) fitToDestination(); });

/* ---- UTILITIES ---- */

function calcDistance(coords) {
  if (!coords?.length || coords.length < 2) return 0;
  let d = 0;
  for (let i = 1; i < coords.length; i++) d += haversine(coords[i-1], coords[i]);
  return d;
}

function haversine(a, b) {
  const [l1, a1] = a.map(c => c * Math.PI / 180);
  const [l2, a2] = b.map(c => c * Math.PI / 180);
  const dlat = a2 - a1, dlng = l2 - l1;
  const sdlat = Math.sin(dlat/2), sdlng = Math.sin(dlng/2);
  const x = sdlat*sdlat + Math.cos(a1)*Math.cos(a2)*sdlng*sdlng;
  return 6371 * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function fmtDuration(s) {
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function getSessionName() {
  const h = new Date().getHours();
  if (h < 12) return 'Morning Walk';
  if (h < 17) return 'Afternoon Walk';
  if (h < 21) return 'Evening Walk';
  return 'Night Walk';
}

function sampleCoords(coords, n) {
  if (!coords?.length || coords.length <= n) return coords || [];
  const step = coords.length / n;
  return Array.from({ length: n }, (_, i) => coords[Math.min(Math.floor(i * step), coords.length - 1)]);
}

function simplifyCoords(coords, n) {
  if (!coords?.length || coords.length <= n) return coords || [];
  const step = coords.length / n;
  return Array.from({ length: n }, (_, i) => coords[Math.min(Math.floor(i * step), coords.length - 1)]);
}

async function fetchElevation(lat, lng) {
  try {
    const r = await fetch(`https://api.maptiler.com/elevation/point?lat=${lat}&lng=${lng}&key=${API_KEY}`);
    const d = await r.json();
    return d.elevation ?? null;
  } catch { return null; }
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
